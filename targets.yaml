  # Style targets (have `queries`) have no retail price. They use a price cap, your size, and `must_have`:
  # every regex group below must match somewhere in the listing title or description.
  embroidered_baggy_jeans:
    label: "Embroidered baggy jeans"
    size: jeans_w36
    category_ids: [257]
    max_price: 30
    queries:
      - embroidered baggy jeans
      - embroidered loose jeans
      - embroidered wide leg jeans
      - embroidered jeans
      - baggy jeans embroidery
      - patchwork baggy jeans
      - y2k embroidered jeans
