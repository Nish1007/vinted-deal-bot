# Vinted deal sniper config.
# Swap what the bot hunts by editing `rotation` (or run: python vinted_bot.py --target designer_jeans).
# Retail prices are rough UK RRP estimates (GBP) for a typical entry-level piece from each brand.
# They are the yardstick for "below 20% of retail", so adjust them if you know better.

settings:
  domain: vinted.co.uk
  max_ratio: 0.20          # only deals priced at or below this fraction of retail
  pages: 1                 # result pages (96 listings each) per brand search
  delay: [2.0, 4.0]        # random pause between requests, in seconds
  enrich: true             # open each candidate's page to check seller reviews, photos, description
  accept_title_size: true  # also accept listings whose title says the right size when the size field is wrong
  price_ceiling: 10        # absolute cap in pounds applied to every target (steals mode); remove or 0 to use each target's own cap
  min_reviews: 5           # skip sellers with fewer reviews than this (0 = no reviews are fine)
  exclude_business: true   # skip business/pro seller accounts, keep private sellers
  hide_risk: []          # e.g. [HIGH] to drop likely-fakes from the report instead of just flagging them
  notify:
    discord_webhook: ""    # or set env VINTED_DISCORD_WEBHOOK
    ntfy_topic: ""         # or set env VINTED_NTFY_TOPIC  (free phone push via ntfy.sh)
    min_risk: MEDIUM       # only alert on deals at this risk level or lower (LOW < MEDIUM < HIGH)

# The current rotation. Every name here must exist under `targets`.
rotation:
  - derschutze_everything
  - derschutze_floral_jeans
  - embroidered_baggy_jeans
  - designer_loafers
  - designer_jeans
  - designer_coats
  - cool_jumpers
  - youngla_anime_tops
  - cds_for_you

# Reusable size profiles. field_patterns match Vinted's size field, title_patterns match the listing title.
sizes:
  shoes_uk9:
    label: "Shoes UK 9"
    field_patterns: ['^(uk\s*)?9(\s*[|/].*)?$']
    title_patterns: ['\buk\s*9\b(?![.,]\d)', '\beu\s*43\b(?![.,]\d)', '\bsize\s*9\b(?![.,]\d)']
    reject_field: ['child', 'kid', 'toddler']
  jeans_w36:
    label: "Jeans waist 36"
    field_patterns: ['^(w\s*)?36(\s*[|/x].*)?$', '^w\s*36\b']
    title_patterns: ['\bw\s*36\b', '\bwaist\s*:?\s*36\b', '\b36\s*(w\b|waist|"|in\b|x\s*\d\d|/\s*\d\d)']
    reject_field: []
  coats_l_xl:
    label: "Coats L / XL"
    field_patterns: ['^(l|xl)(\s*[|/].*)?$']
    title_patterns: ['\bsize\s*(xl|l)\b', '\b(xl|l)\s*(mens|men.s)\b']
    reject_field: []

  jumpers_l_xl:
    label: "Jumpers L / XL"
    field_patterns: ['^(l|xl)(\s*[|/].*)?$']
    title_patterns: ['\bsize\s*(xl|l)\b', '\b(xl|l)\s*(mens|men.s)\b']
    reject_field: []

  derschutze_sizes:
    label: "Derschutze sizes (W36 bottoms, L/XL tops)"
    field_patterns: ['^(w\s*)?36(\s*[|/x].*)?$', '^w\s*36\b', '^(l|xl)(\s*[|/].*)?$']
    title_patterns: ['\bw\s*36\b', '\bwaist\s*:?\s*36\b', '\bsize\s*(xl|l)\b', '\b36\s*(w\b|x\s*\d\d)']
    reject_field: []

